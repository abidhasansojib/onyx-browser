<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Page Not Available</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --text-main: #202124;
      --text-sub: #5F6368;
      --primary: #1A73E8;
      --primary-text: #FFFFFF;
      --border: #DADCE0;
      --surface: #F8F9FA;
      --danger: #D93025;
      --icon-color: #5F6368;
      --btn-bg: #FFFFFF;
      --btn-hover: #F1F3F4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text-main: #E8EAED;
        --text-sub: #9AA0A6;
        --primary: #8AB4F8;
        --primary-text: #202124;
        --border: #3C4043;
        --surface: #303134;
        --danger: #F28B82;
        --icon-color: #9AA0A6;
        --btn-bg: #303134;
        --btn-hover: #3C4043;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Google Sans", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }

    .error-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      color: var(--icon-color);
    }

    .error-icon.danger { color: var(--danger); }

    h1 {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-main);
      margin-bottom: 12px;
      max-width: 320px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-sub);
      margin-bottom: 32px;
      max-width: 320px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn {
      width: 100%;
      height: 40px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid var(--border);
      outline: none;
      background: var(--btn-bg);
      color: var(--primary);
      transition: background 0.15s;
      letter-spacing: 0.01em;
    }

    .btn:active { background: var(--btn-hover); }

    .btn-primary {
      background: var(--primary);
      color: var(--primary-text);
      border-color: transparent;
    }

    .btn-primary:active { opacity: 0.85; }

    .domain-chip {
      display: inline-block;
      font-size: 12px;
      color: var(--text-sub);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px 10px;
      margin-bottom: 16px;
      word-break: break-all;
      max-width: 300px;
    }

    /* SSL advanced section */
    .ssl-box {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      font-size: 13px;
      color: var(--text-sub);
      text-align: left;
      max-width: 320px;
    }

    .ssl-proceed {
      color: var(--danger);
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
      margin-top: 10px;
      display: inline-block;
    }

    .hsts-notice {
      color: var(--danger);
      font-weight: 500;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <svg id="errorIcon" class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Default: wifi-off icon, replaced by JS -->
    <line x1="1" y1="1" x2="23" y2="23"/>
    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
    <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
    <line x1="12" y1="20" x2="12.01" y2="20"/>
  </svg>

  <div id="domainChip" class="domain-chip" style="display:none;"></div>
  <h1 id="errorTitle">Page not available</h1>
  <p id="errorDesc">Couldn't connect to this site.</p>

  <div class="actions">
    <button class="btn btn-primary" id="btnPrimary">Try again</button>
    <button class="btn" id="btnSecondary">Network settings</button>
  </div>

  <div class="ssl-box" id="sslBox">
    <div id="sslMsg"></div>
    <div id="hstsNotice" class="hsts-notice" style="display:none;">Your network operator may be monitoring your connection. You cannot bypass this security warning.</div>
    <span class="ssl-proceed" id="btnProceedSsl">Proceed to site (unsafe)</span>
  </div>

  <script>
    // ── Icon paths ─────────────────────────────────────────────────────────────
    const ICONS = {
      wifi_off: `<line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>`,
      shield_off: `<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>`,
      cloud_off: `<path d="M18.36 14a2 2 0 0 0 .3-1.11A4 4 0 0 0 11.5 10m0 0A5 5 0 0 0 6 15H5a3 3 0 0 0 0 6h13a3 3 0 0 0 0-6h-2"/><line x1="1" y1="1" x2="23" y2="23"/>`,
      file_x: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="10" y1="13" x2="16" y2="13"/><line x1="10" y1="17" x2="16" y2="17"/><line x1="10" y1="9" x2="12" y2="9"/>`,
      alert_triangle: `<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
      lock: `<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>`
    };

    // ── Parse error data ───────────────────────────────────────────────────────
    let data = null;
    const b64 = '{{ERROR_JSON_B64}}';
    if (!b64.startsWith('{{') && b64.length > 0) {
      try {
        data = JSON.parse(decodeURIComponent(escape(atob(b64))));
      } catch (e) {}
    }

    if (!data) {
      const p = new URLSearchParams(window.location.search);
      data = {
        category: 'GENERIC',
        errorCode: p.get('error') || 'ERR_FAILED',
        title: 'Page not available',
        description: 'Something went wrong.',
        url: p.get('url') || window.location.href,
        domain: p.get('url') || window.location.href,
        primaryButtonText: 'Try again',
        primaryButtonAction: 'reload',
        secondaryButtonText: 'Network settings',
        secondaryButtonAction: 'network_settings',
        isDanger: false,
        technicalDetails: '',
        isHstsEnforced: false,
        canCheckWayback: false
      };
    }

    // ── Populate UI ────────────────────────────────────────────────────────────
    const icon = document.getElementById('errorIcon');
    const titleEl = document.getElementById('errorTitle');
    const descEl = document.getElementById('errorDesc');
    const domainChip = document.getElementById('domainChip');
    const btnPrimary = document.getElementById('btnPrimary');
    const btnSecondary = document.getElementById('btnSecondary');

    titleEl.textContent = data.title;
    descEl.textContent = data.description;
    btnPrimary.textContent = data.primaryButtonText;
    btnSecondary.textContent = data.secondaryButtonText;

    if (data.domain && data.domain !== data.url) {
      domainChip.textContent = data.domain;
      domainChip.style.display = 'inline-block';
    }

    // Set icon by category
    switch (data.category) {
      case 'OFFLINE':
        icon.innerHTML = ICONS.wifi_off;
        break;
      case 'SECURITY':
        icon.innerHTML = ICONS.lock;
        icon.classList.add('danger');
        break;
      case 'SERVER_DOWN':
        icon.innerHTML = ICONS.cloud_off;
        break;
      case 'SHIELDS_BLOCKED':
        icon.innerHTML = ICONS.shield_off;
        break;
      case 'FILE_ERROR':
        icon.innerHTML = ICONS.file_x;
        break;
      default:
        icon.innerHTML = ICONS.alert_triangle;
        break;
    }

    // SSL: show advanced box
    if (data.category === 'SECURITY') {
      const sslBox = document.getElementById('sslBox');
      const sslMsg = document.getElementById('sslMsg');
      sslMsg.textContent = data.technicalDetails || 'The site\'s certificate could not be verified.';
      sslBox.style.display = 'block';
      if (data.isHstsEnforced) {
        document.getElementById('hstsNotice').style.display = 'block';
        document.getElementById('btnProceedSsl').style.display = 'none';
      }
    }

    // ── Action handlers ────────────────────────────────────────────────────────
    function exec(action) {
      const bridge = window.OnyxErrorBridge;
      switch (action) {
        case 'reload':
          if (bridge && bridge.reload) bridge.reload();
          else if (data.url && !data.url.startsWith('file:///android_asset'))
            window.location.href = data.url;
          else window.location.reload();
          break;
        case 'network_settings':
          if (bridge && bridge.openNetworkSettings) bridge.openNetworkSettings();
          break;
        case 'wayback_machine':
          if (bridge && bridge.checkWaybackMachine) bridge.checkWaybackMachine(data.url);
          else window.open('https://web.archive.org/web/*/' + encodeURIComponent(data.url));
          break;
        case 'search':
          if (bridge && bridge.search) bridge.search(data.domain || data.url);
          else window.location.href = 'https://search.brave.com/search?q=' + encodeURIComponent(data.domain || '');
          break;
        case 'back':
          if (bridge && bridge.goBack) bridge.goBack();
          else if (window.history.length > 1) window.history.back();
          else exec('home');
          break;
        case 'home':
          if (bridge && bridge.goHome) bridge.goHome();
          else window.location.href = 'about:blank';
          break;
        case 'advanced_ssl':
          const box = document.getElementById('sslBox');
          box.style.display = box.style.display === 'block' ? 'none' : 'block';
          break;
        case 'shields':
          if (bridge && bridge.openShields) bridge.openShields();
          break;
        case 'downloads':
          if (bridge && bridge.openDownloads) bridge.openDownloads();
          break;
      }
    }

    btnPrimary.addEventListener('click', () => exec(data.primaryButtonAction));
    btnSecondary.addEventListener('click', () => exec(data.secondaryButtonAction));

    document.getElementById('btnProceedSsl').addEventListener('click', () => {
      if (window.OnyxErrorBridge && window.OnyxErrorBridge.proceedSsl)
        window.OnyxErrorBridge.proceedSsl();
    });
  </script>
</body>
</html>
