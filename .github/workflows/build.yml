name: Build Onyx Browser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Debug'
          - 'Both'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Locate NDK
        run: |
          yes | sdkmanager --licenses || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Installing NDK r26b via sdkmanager..."
            echo "y" | sdkmanager "ndk;26.3.11579264"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Found Android NDK at: $NDK_DIR"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk

      - name: Build Native Rust Engine (libadblock_bridge.so)
        run: |
          mkdir -p app/src/main/jniLibs
          cd rust_engine
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release
          cd ..
          echo "Generated JNI shared libraries:"
          find app/src/main/jniLibs -type f

      - name: Fetch and Convert Official Lucide Icons
        run: |
          chmod +x scripts/fetch_icons.sh
          ./scripts/fetch_icons.sh

      - name: Synchronize Brave Filter Lists
        run: |
          chmod +x scripts/update_filter_lists.sh
          ./scripts/update_filter_lists.sh

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "KEYSTORE_PATH=${{ github.workspace }}/keystore/release.keystore" >> $GITHUB_ENV
            echo "Release signing keystore decoded to keystore/release.keystore"
          else
            echo "Using committed release.keystore for consistent reproducible signing"
            echo "KEYSTORE_PATH=${{ github.workspace }}/keystore/release.keystore" >> $GITHUB_ENV
          fi

      - name: Compute Automatic Versioning & Build Type
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$(( 1000 + RUN_NUM ))
          VERSION_NAME="1.0.${RUN_NUM}"
          TAG_NAME="v1.0.${RUN_NUM}"
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"

          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV

          echo "=========================================="
          echo "Build Type:    $BUILD_TYPE"
          echo "Version Name:  $VERSION_NAME"
          echo "Version Code:  $VERSION_CODE"
          echo "Git Tag:       $TAG_NAME"
          echo "=========================================="

      # ------------------------------------------------------------------------
      # RELEASE BUILD: ABI Splits + R8 Minification + Multi-Architecture APKs
      # ------------------------------------------------------------------------
      - name: Build Release APKs (ABI Splits & R8 Minified)
        if: env.BUILD_TYPE == 'Release' || env.BUILD_TYPE == 'Both'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'onyxrelease123' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'onyxrelease123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'onyx-browser' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'onyxrelease123' }}
        run: |
          ./gradlew assembleRelease \
            -PenableAbiSplits=true \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            --stacktrace

          echo "Generated Release APKs:"
          ls -lh app/build/outputs/apk/release/

      - name: Organize and Label Release APKs
        if: env.BUILD_TYPE == 'Release' || env.BUILD_TYPE == 'Both'
        run: |
          mkdir -p release_apks
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            if [ -f "$f" ]; then
              CLEAN_NAME=$(echo "$f" | sed "s/^app-/Onyx-Browser-${{ env.TAG_NAME }}-/")
              cp "$f" "../../../../../release_apks/$CLEAN_NAME"
              echo "Packaged release binary: $CLEAN_NAME ($(du -h "$f" | cut -f1))"
            fi
          done
          cd ../../../../..
          echo "Final Release Binaries:"
          ls -lh release_apks/

      - name: Publish GitHub Release
        if: env.BUILD_TYPE == 'Release' || env.BUILD_TYPE == 'Both'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.TAG_NAME }}"
          TITLE="Onyx Browser ${{ env.TAG_NAME }}"

          cat << 'EOF' > release_notes.md
          ## Onyx Browser Release

          ### Architecture & Download Guide
          - **`Onyx-Browser-*-arm64-v8a-release.apk`** (**Recommended**): Ultra-compact build (~14–16 MB) optimized for 95%+ of modern Android phones and tablets (64-bit ARM).
          - **`Onyx-Browser-*-universal-release.apk`**: Universal build containing all native architectures (~35 MB). Compatible with any Android device.
          - **`Onyx-Browser-*-armeabi-v7a-release.apk`**: 32-bit ARM build for older Android devices.
          - **`Onyx-Browser-*-x86_64-release.apk`**: 64-bit Intel/AMD build for Android emulators and ChromeOS.

          ### Optimizations in this Release
          - **Brave Adblock Engine**: Native Rust `libadblock_bridge.so` with network filtering and cosmetic CSS rules.
          - **R8 / ProGuard Minified**: Dead code stripped and resource shrunk with zero impact on adblocking or passkeys.
          - **Automatic Versioning**: Continuous build tracking (`v1.0.${{ github.run_number }}`).
          EOF

          gh release create "$TAG" release_apks/*.apk \
            --title "$TITLE" \
            --notes-file release_notes.md \
            --generate-notes || gh release upload "$TAG" release_apks/*.apk --clobber

      - name: Upload Release APKs to Workflow Artifacts
        if: env.BUILD_TYPE == 'Release' || env.BUILD_TYPE == 'Both'
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-Browser-Release-APKs
          path: release_apks/*.apk

      # ------------------------------------------------------------------------
      # DEBUG BUILD: Single Universal APK, No Minification, Actions Artifact Only
      # ------------------------------------------------------------------------
      - name: Build Debug APK
        if: env.BUILD_TYPE == 'Debug' || env.BUILD_TYPE == 'Both'
        run: |
          ./gradlew assembleDebug \
            -PenableAbiSplits=false \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            --stacktrace

          echo "Generated Debug APK:"
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        if: env.BUILD_TYPE == 'Debug' || env.BUILD_TYPE == 'Both'
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-Browser-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
