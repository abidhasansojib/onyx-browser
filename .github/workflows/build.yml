name: Build Onyx Browser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Determine & Install Android NDK
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1 || true)
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "Installing Android NDK r26b..."
            echo "y" | sdkmanager "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "Using NDK at: $NDK_PATH"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Native Rust Engine (libadblock_bridge.so)
        run: |
          mkdir -p app/src/main/jniLibs
          cd rust_engine
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release
          cd ..
          echo "Built native JNI libraries:"
          ls -la app/src/main/jniLibs/*

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Onyx Browser APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-Browser-APK
          path: app/build/outputs/apk/**/*.apk
