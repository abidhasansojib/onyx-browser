name: Build Onyx Browser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Locate NDK
        run: |
          yes | sdkmanager --licenses || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Installing NDK r26b via sdkmanager..."
            echo "y" | sdkmanager "ndk;26.3.11579264"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "Found Android NDK at: $NDK_DIR"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk

      - name: Build Native Rust Engine (libadblock_bridge.so)
        run: |
          mkdir -p app/src/main/jniLibs
          cd rust_engine
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release
          cd ..
          echo "Generated JNI shared libraries:"
          find app/src/main/jniLibs -type f

      - name: Fetch and Convert Official Lucide Icons
        run: |
          chmod +x scripts/fetch_icons.sh
          ./scripts/fetch_icons.sh

      - name: Synchronize Brave Filter Lists
        run: |
          chmod +x scripts/update_filter_lists.sh
          ./scripts/update_filter_lists.sh

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Release signing keystore detected — release build will use it."
          else
            echo "WARNING: KEYSTORE_BASE64 secret not set. Release APK will fall back to debug signing."
          fi

      - name: Build Release and Debug APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Onyx Browser APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-Browser-APK
          path: app/build/outputs/apk/**/*.apk
