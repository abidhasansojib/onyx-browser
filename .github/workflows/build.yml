name: Build Onyx Browser

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - 'Release'
          - 'Prerelease'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Locate NDK
        run: |
          yes | sdkmanager --licenses || true
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Installing NDK r26b via sdkmanager..."
            echo "y" | sdkmanager "ndk;26.3.11579264"
            NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "Found Android NDK at: $NDK_DIR"

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo-ndk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk

      - name: Build Native Rust Engine (libadblock_bridge.so)
        run: |
          if [ -f patches/adblock-rust.patch ]; then
            echo "Applying adblock-rust patch..."
            git -C external/adblock-rust apply ../../patches/adblock-rust.patch || true
          fi
          mkdir -p app/src/main/jniLibs
          cd rust_engine
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../app/src/main/jniLibs \
            build --release
          cd ..
          echo "Generated JNI shared libraries:"
          find app/src/main/jniLibs -type f

      - name: Fetch and Convert Official Lucide Icons
        run: |
          chmod +x scripts/fetch_icons.sh
          ./scripts/fetch_icons.sh

      - name: Synchronize Brave Filter Lists
        run: |
          chmod +x scripts/update_filter_lists.sh
          ./scripts/update_filter_lists.sh

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "KEYSTORE_PATH=${{ github.workspace }}/keystore/release.keystore" >> $GITHUB_ENV
            echo "Release signing keystore decoded to keystore/release.keystore"
          else
            echo "Using committed release.keystore for consistent reproducible signing"
            echo "KEYSTORE_PATH=${{ github.workspace }}/keystore/release.keystore" >> $GITHUB_ENV
          fi

      - name: Compute Automatic Versioning & Build Type
        id: versioning
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$(( 1000 + RUN_NUM ))
          BUILD_TYPE="${{ github.event.inputs.build_type || 'Release' }}"

          MAJOR=$(( 1 + RUN_NUM / 1000 ))
          MINOR=$(( (RUN_NUM / 100) % 10 ))
          PATCH=$(( RUN_NUM % 100 ))
          BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          if [ "$BUILD_TYPE" = "Prerelease" ]; then
            VERSION_NAME="${BASE_VERSION}-prerelease"
            TAG_NAME="v${BASE_VERSION}-prerelease"
          else
            VERSION_NAME="${BASE_VERSION}"
            TAG_NAME="v${BASE_VERSION}"
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV

          echo "=========================================="
          echo "Build Type:    $BUILD_TYPE"
          echo "Version Name:  $VERSION_NAME"
          echo "Version Code:  $VERSION_CODE"
          echo "Git Tag:       $TAG_NAME"
          echo "=========================================="

      - name: Run Automated Unit Test Suite
        run: |
          ./gradlew :core:common:test testReleaseUnitTest --stacktrace

      # ------------------------------------------------------------------------
      # RELEASE BUILD: ABI Splits + R8 Minification + Signed APKs
      # ------------------------------------------------------------------------
      - name: Build Release APKs (ABI Splits & R8 Minified)
        if: env.BUILD_TYPE == 'Release'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'onyx-browser' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PenableAbiSplits=true \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            --stacktrace

          echo "Generated Release APKs:"
          ls -lh app/build/outputs/apk/release/

      # ------------------------------------------------------------------------
      # PRERELEASE BUILD: ABI Splits + R8 Minification + Signed APKs (*.prerelease)
      # ------------------------------------------------------------------------
      - name: Build Prerelease APKs (ABI Splits & R8 Minified)
        if: env.BUILD_TYPE == 'Prerelease'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'onyx-browser' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assemblePrerelease \
            -PenableAbiSplits=true \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            --stacktrace

          echo "Generated Prerelease APKs:"
          ls -lh app/build/outputs/apk/prerelease/

      - name: Organize and Label APKs
        run: |
          mkdir -p package_apks
          BUILD_DIR="release"
          if [ "${{ env.BUILD_TYPE }}" = "Prerelease" ]; then
            BUILD_DIR="prerelease"
          fi
          cd app/build/outputs/apk/${BUILD_DIR}/
          for f in *.apk; do
            if [ -f "$f" ]; then
              CLEAN_NAME=$(echo "$f" | sed "s/^app-/Onyx-Browser-${{ env.TAG_NAME }}-/")
              cp "$f" "../../../../../package_apks/$CLEAN_NAME"
              echo "Packaged binary: $CLEAN_NAME ($(du -h "$f" | cut -f1))"
            fi
          done
          cd ../../../../..
          
          # Generate SHA-256 cryptographic checksums for all packaged binaries
          cd package_apks
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          
          echo "Final Binaries & Checksums:"
          ls -lh package_apks/

      - name: Commit Bundled Filter Lists to Repository
        run: |
          if [ -n "$(git status --porcelain app/src/main/assets external/adblock-lists)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/easylist_rules.txt app/src/main/assets/brave-resources.json external/adblock-lists 2>/dev/null || true
            git commit -m "chore(filters): bundle updated filter rules for ${{ env.TAG_NAME }}"
            git push origin main
            echo "Committed and pushed bundled filter rules for ${{ env.TAG_NAME }} to main."
          else
            echo "Filter assets unchanged, skipping commit."
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.TAG_NAME }}"
          REPO="${{ github.repository }}"
          BUILD_TYPE="${{ env.BUILD_TYPE }}"

          if [ "$BUILD_TYPE" = "Prerelease" ]; then
            TITLE="Onyx Browser $TAG (Pre-release)"
            EXTRA_FLAGS="--prerelease"
          else
            TITLE="Onyx Browser $TAG"
            EXTRA_FLAGS=""
          fi

          # Ensure latest tags are available
          git fetch --tags origin 2>/dev/null || true

          # Generate Clean Categorized Release Notes
          python3 scripts/generate_release_notes.py \
            --tag "$TAG" \
            --repo "$REPO" \
            --output release_notes.md \
            --apks-dir package_apks

          echo "Generated Categorized Release Notes:"
          cat release_notes.md

          gh release create "$TAG" package_apks/*.apk package_apks/SHA256SUMS.txt \
            $EXTRA_FLAGS \
            --title "$TITLE" \
            --notes-file release_notes.md || (gh release upload "$TAG" package_apks/*.apk package_apks/SHA256SUMS.txt --clobber && gh release edit "$TAG" $EXTRA_FLAGS --notes-file release_notes.md)

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Onyx-Browser-${{ env.BUILD_TYPE }}-APKs
          path: |
            package_apks/*.apk
            package_apks/SHA256SUMS.txt
