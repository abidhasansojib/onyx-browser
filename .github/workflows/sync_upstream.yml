name: Sync Upstream Brave Repositories

on:
  schedule:
    # Run once daily at 04:00 UTC to check for adblock-rust engine updates
    - cron: '0 4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [ upstream_update ]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync Brave adblock-rust Native Engine
    # Strictly ensure this only runs on the main repository, never on forks
    if: github.repository == 'abidhasansojib/onyx-browser'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Onyx Browser Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync adblock-rust Native Engine Submodule
        run: |
          chmod +x scripts/sync_upstream.sh
          ./scripts/sync_upstream.sh --engine-only

      - name: Check For Engine Updates
        id: check_engine
        run: |
          if [ -n "$(git status --porcelain external/adblock-rust)" ]; then
            OLD_HASH=$(git diff external/adblock-rust | grep '^-Subproject' | awk '{print $3}' | cut -c1-7 || git rev-parse :external/adblock-rust | cut -c1-7)
            NEW_HASH=$(git -C external/adblock-rust rev-parse --short HEAD)
            echo "engine_updated=true" >> $GITHUB_OUTPUT
            echo "old_hash=$OLD_HASH" >> $GITHUB_OUTPUT
            echo "new_hash=$NEW_HASH" >> $GITHUB_OUTPUT
            echo "adblock-rust native engine updated: $OLD_HASH -> $NEW_HASH"
          else
            echo "engine_updated=false" >> $GITHUB_OUTPUT
            echo "adblock-rust native engine is unchanged and up-to-date. No commits needed."
          fi

      - name: Commit and Push Submodule Update
        if: steps.check_engine.outputs.engine_updated == 'true'
        run: |
          NEW_HASH="${{ steps.check_engine.outputs.new_hash }}"
          git add external/adblock-rust rust_engine/adblock-rust 2>/dev/null || true
          git commit -m "chore(upstream): auto-sync Brave adblock-rust engine ($NEW_HASH)"
          git push origin main
          echo "Committed and pushed adblock-rust update ($NEW_HASH) to main."

      - name: Notify Developer via GitHub Issue
        if: steps.check_engine.outputs.engine_updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/notify_upstream_update.py \
            --old "${{ steps.check_engine.outputs.old_hash }}" \
            --new "${{ steps.check_engine.outputs.new_hash }}"
